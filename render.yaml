# Render Blueprint — https://render.com/docs/blueprint-spec
#
# Deploys the Next.js app as a web service, plus two cron jobs:
#   - email-sync: polls every active email_accounts mailbox's INBOX via IMAP
#     (app/api/cron/email-sync/route.ts).
#   - task-automation: sweeps for TSK-02's four automated task triggers —
#     quote follow-up, payment due, supplier confirmation, travel prep
#     (app/api/cron/task-automation/route.ts).
# The remaining cron jobs stay commented out until their route handlers
# exist (Phase 2+: quote-expiry, lead-release-sla, dispatch-wave-escalation,
# document-expiry, daily-brief) — uncomment and point each at its
# /api/cron/<name> route as those phases are built.

services:
  - type: web
    name: global-transport-crm
    runtime: node
    plan: starter
    branch: main
    buildCommand: npm install && npm run build
    startCommand: npm run start
    healthCheckPath: /login
    envVars:
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: CRON_SECRET
        generateValue: true
      - key: NEXT_PUBLIC_APP_URL
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: EMAIL_CREDENTIALS_KEY
        generateValue: true
      - key: NEXT_PUBLIC_GOOGLE_MAPS_API_KEY
        sync: false
      - key: WHATSAPP_API_KEY
        sync: false
      - key: WHATSAPP_API_BASE_URL
        sync: false
      - key: NODE_VERSION
        value: 20.17.0

  - type: cron
    name: email-sync
    runtime: node
    schedule: "*/5 * * * *"
    buildCommand: npm install
    startCommand: >
      curl -sf -X POST "$NEXT_PUBLIC_APP_URL/api/cron/email-sync"
      -H "Authorization: Bearer $CRON_SECRET"
    envVars:
      - key: NEXT_PUBLIC_APP_URL
        sync: false
      - key: CRON_SECRET
        sync: false

  - type: cron
    name: task-automation
    runtime: node
    schedule: "0 * * * *"
    buildCommand: npm install
    startCommand: >
      curl -sf -X POST "$NEXT_PUBLIC_APP_URL/api/cron/task-automation"
      -H "Authorization: Bearer $CRON_SECRET"
    envVars:
      - key: NEXT_PUBLIC_APP_URL
        sync: false
      - key: CRON_SECRET
        sync: false

